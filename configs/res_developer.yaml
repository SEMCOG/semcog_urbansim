bldg_sqft_per_job: 400.0

min_unit_size: 1000

max_parcel_size: 1100000

drop_after_build: True

residential: True

keep_suboptimal: True

noise_scale: 100000

# City excess momentum in the developer's expected households (models.city_excess_momentum):
# the 2020-25 change above the city's large-area share, multiplied by this factor per year
# (0.8: half-life about 3 years; backcast of 2000-2025 MCD history)
city_momentum_fade: 0.8

# How far a city's share of its large area's housing stock may drift from the share
# it started with (models.city_share_cap)
city_share_band: 0.15

la_max_ratio: 1.2
# largest factor LA alignment may scale MCD targets by; above 1.0 the cap pushes
# targets up as well as down (was la_max_ratio, i.e. 1.2)
la_max_scale: 1.0

# Minimum of the large-area cap, as a share of the LA's base-year build rate
hist_floor_factor: 0.5

# Feasibility residential price floor: parcels priced below this share of their LA
# average are lifted to that share of the LA replacement price
res_price_floor_share: 0.8

# Feasibility sale price of a form = parcel residential price x factor (after the floor).
# Within-zone median price per sqft relative to single-family, buildings built 2000+,
# base year main_101926 (condo 0.81, apartment 0.67). Forms not listed: 1.0.
form_price_factors:
  condo: 0.81
  apartment: 0.67

# Rebuild priority for orphaned demolished SF parcels (demolished, empty, no future event).
# Site-selection weight = boost * decay^(years_since_demo), capped at max_share of the mass.
# scheduled_factor further lifts parcels whose demolition was a scheduled (planned) event.
demo_rebuild_boost: 20.0
demo_rebuild_decay: 0.6
demo_rebuild_window: 5
demo_rebuild_max_share: 0.5
demo_rebuild_scheduled_factor: 3.0

# Phased delivery of developer projects (models.deliver_phased_units): a large
# project delivers at most this many units per year (planned_units keeps the
# full size; pending units count as supply in the city's demand).
phasing:
  enabled: true
  units_per_year:
    81: 75    # single-family: subdivision sales
    82: 75    # attached / condo
    83: 200   # apartments: lease-up
  default_units_per_year: 200

# Type mix: an apartment needs at least this many net units (multi-family,
# 5+ units); also the smallest city apartment quota of the type mix. 0 or missing: no minimum.
min_apartment_units: 5

# Type mix: a loss-making condo needs at least this many net units (least-loss pass
# only; profitable condos and city condo quotas unchanged). 0 or missing: no minimum.
min_loss_condo_units: 5

# >>> type_mix
# Residential building-type mix (type_mix.py): developer units split by target form shares
# by large area and year (configs/res_type_mix.csv); scenario selects the curve.
type_mix:
  file: res_type_mix.csv
  scenario: E2
