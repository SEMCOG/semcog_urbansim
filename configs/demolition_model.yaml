min_age_eligible: 10
max_res_occupancy_eligible: 0.85
max_nonres_occupancy_eligible: 0.85
scenario_rate_multiplier: 1.0
# Yearly target: fixed_volume = 2021-2024 city volumes (demolition_rates.csv);
# stock_rate = rate x current stock (demolition_stock_rates.csv, demolition_stock.py)
volume_method: stock_rate
stock_rate:
  res_stock_max_year_built: 1949
  nonres_stock_max_year_built: 1969
detroit:
  large_area_ids: [5]
  rate_per_vacant_unit: 0.042          # 2021-2024 demolitions per ACS "other vacant" unit
  vacancy_floor_min: 0.05              # floor = max(min, share x 2025 neighborhood vacancy)
  vacancy_floor_share_of_base: 0.5
  value_rule_exempt:                   # vacant pool: skip the improvement/land value rule
    building_types: [81, 82, 83]
    max_units: 4
max_impr_to_land_ratio: 5
# Vacancy response (stock_rate only): outside Detroit, the residential target of a city and
# type is at least rate x its vacant units. 2021-2024 demolitions were about 1.1% of the ACS
# vacant units a year outside Detroit (1.0-1.4% by vacancy class; 1.0-1.7% in 2011-2019).
vacancy_response:
  enabled: false
  rate: 0.011
  # and at least excess_share x the vacant units above the city's target vacancy (input
  # target table); Detroit 2010-2019 removed ~8% of its excess vacant units a year. 0 = off.
  excess_share: 0.0
# Vacancy floor in all cities (Detroit keeps its neighborhood floor above), and
# demolished space not rebuilt by the developers (vacancy_floor.py). Base-year vacancy
# = the base-year column of the target vacancy tables.
vacancy_floor:
  enabled: true
  res_min: 0.05            # housing: floor = max(res_min, share x base-year vacancy)
  share_of_base: 0.5       # nonres job-space measure: floor = share x base-year vacancy
  res_share_of_base: 0.5   # housing share (default = share_of_base); 0.8 with res_min 0 never exceeds base
  detroit_target_floor: false  # true: Detroit neighborhoods are not demolished below their target vacancy of the year
