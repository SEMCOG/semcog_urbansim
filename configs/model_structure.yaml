models: 

    hlcm: 
        model_type: location_choice
        agents_name: households
        alternatives_id_name: building_id
        alternatives_name: buildings
        supply_variable: residential_units
        vacant_variable: vacant_residential_units
        calibration:
            enabled: true
            strength: 2.5 # log-scale gain on the target; 0 disables
            clip: [0.5, 2.0]
            # score: add ln(w) to each slot's key | stratified: set per-tract slot counts
            method: score
            # floor (use lower bound if weight not found) | neutral (1)
            zero_base_share: neutral
            # weight units built during the run by the base-year mix of comparable new stock
            fill_prior: true
            # shrink a tract's target toward 1 by n/(n+k) base-year households; 0 disables
            shrink_k: 5
            # target a tract's own base-year mix tilted by its new-stock ratio
            expected_share: true
            # true smooths through an XGBoost fit; false uses the tract ratio directly
            use_regressor: false
            # MCD weight from its vacancy over its own target, centered on the large
            # area's unit-weighted mean; strength 0 disables
            mcd_vacancy:
                strength: 0.5
                clip: [0.5, 2.0]
            # per-dimension holds on one category's marginal; clip/shrink_k default to
            # the joint weight's. A value is a strength, or a block of its own.
            marginal:
                clip: [0.5, 2.0]
                shrink_k: 5
                dimensions:
                    income: 0
                    children: 0
                    senior: 0

    elcm: 
        model_type: location_choice
        agents_name: jobs
        alternatives_id_name: building_id
        alternatives_name: buildings
        supply_variable: job_spaces
        vacant_variable: vacant_job_spaces
        # lift scheduled-event non-residential space in the job choice; 1.0 disables
        event_boost:
            factor: 2.0
            # years after year_built the lift applies; 0 = for the whole run
            max_age: 5
        calibration:
            enabled: false

            # Calibration method can be 'multiplicative' or 'log_weighted'
            calibration_method: multiplicative  # or 'log_weighted'

            weights:
                # Weights for the calibration method
                building_age: 1.0
                vacancy: 1.0
                btype_matrix: 1.0
                taz_cluster: 1.0

            use_taz_cluster_by_sector:
                # Use TAZ cluster for specific sectors
                14: true
                3: true

            overrides:
                # Overrides for specific sector LA combinations
                la_5_sector_14:
                    calibration_method: log_weighted
                    weights:
                        building_age: 0.1
                        vacancy: 0.5
                        btype_matrix: 0.1
                        taz_cluster: 3.0
