models: 

    hlcm: 
        model_type: location_choice
        agents_name: households
        alternatives_id_name: building_id
        alternatives_name: buildings
        supply_variable: residential_units
        vacant_variable: vacant_residential_units
        calibration:
            enabled: true
            strength: 2.5 # log-scale gain on the target; 0 disables
            clip: [0.5, 2.0]
            #  floor (use lower bound if weight not found) | neutral (1)
            zero_base_share: neutral
            # weight units built during the run by the base-year mix of
            # comparable new stock
            fill_prior: true
            # shrink a tract's target toward 1 by base-year households in the
            # segment: n/(n+k). 0 disables it, and unshrunk thin cells inject
            # enough noise that closure regresses above strength 3; k 5 keeps
            # 90% of a 40-household cell's signal
            shrink_k: 5
            # hold a tract to the mix implied by what it built: its own base-year
            # mix tilted by the new-stock ratio, not the large area's new-stock mix
            expected_share: true
            # use_regressor:
            # true smooths it through an XGBoost fit 
            # false applies the base/current tract ratio directly 
            use_regressor: false

    elcm: 
        model_type: location_choice
        agents_name: jobs
        alternatives_id_name: building_id
        alternatives_name: buildings
        supply_variable: job_spaces
        vacant_variable: vacant_job_spaces
        calibration:
            enabled: false

            # Calibration method can be 'multiplicative' or 'log_weighted'
            calibration_method: multiplicative  # or 'log_weighted'

            weights:
                # Weights for the calibration method
                building_age: 1.0
                vacancy: 1.0
                btype_matrix: 1.0
                taz_cluster: 1.0

            use_taz_cluster_by_sector:
                # Use TAZ cluster for specific sectors
                14: true
                3: true

            overrides:
                # Overrides for specific sector LA combinations
                la_5_sector_14:
                    calibration_method: log_weighted
                    weights:
                        building_age: 0.1
                        vacancy: 0.5
                        btype_matrix: 0.1
                        taz_cluster: 3.0
