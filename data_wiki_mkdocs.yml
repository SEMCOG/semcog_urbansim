site_name: SEMCOG Forecast Data Wiki
site_description: Data developer reference for SEMCOG UrbanSim forecast data
site_author: SEMCOG
docs_dir: data_wiki
site_dir: data_wiki_site

theme:
  name: material
  palette:
    primary: teal
    accent: green
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.integrate
    - toc.follow

use_directory_urls: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - js/nav-toggle.js

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Data Domains:
    - Land Use: domains/land-use.md
    - Geography: domains/geography.md
    - Demographics: domains/demographics.md
    - Employment: domains/employment.md
    - Development & Context: domains/development-context.md
    - Street Networks: domains/networks.md
    - Accessibility: domains/accessibility.md
    - Travel Data: domains/travel.md
  - Reference:
    - Table Catalog: reference/table-catalog.md
